server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Long-cache hashed assets
  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Cheap health check endpoint for the ALB target group
  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }

  # SPA fallback so React Router routes work after refresh
  location / {
    try_files $uri $uri/ /index.html;
  }
}
